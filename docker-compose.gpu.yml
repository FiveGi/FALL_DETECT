# Overlay for running on a machine with an NVIDIA GPU:
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Why it exists: pose extraction runs on every frame with no stride, and on CPU it manages
# ~2 fps (2 cores) to ~8 fps (16 cores) -- far below what the fall classifier's window
# assumes, which makes a live camera drop most of its frames and recall collapse
# (training/eval_v3_frame_drop.py, training/eval_urfd_framerate.py). On this machine's GPU
# the pipeline comfortably exceeds the 15 fps the deployed model is trained for, which
# V3_TARGET_FPS below then holds it to so the rate is a setting and not an accident.
#
# The base file is left untouched so the CPU-only server keeps working as before.
services:
  backend:
    build:
      args:
        TORCH_VARIANT: gpu
    image: elderly-surveillance-app:gpu
  celery_worker:
    image: elderly-surveillance-app:gpu
    environment:
      # The base file pins this empty to force CPU; clear it so the container sees the GPU.
      - CUDA_VISIBLE_DEVICES=0
      - V3_DEVICE=cuda
      # Classify at a fixed 15 fps rather than however fast this machine happens to be.
      # The camera loop has no stride, so without this the sampling rate is whatever the
      # hardware gives (16.8-20 fps here) and the deployed accuracy moves with it: the same
      # model catches 43/60 URFD falls at 30 fps and 17/60 at 10 fps. 15 fps is what the
      # model is trained for and is sustainable with headroom for several cameras.
      - V3_TARGET_FPS=15
    deploy:
      resources:
        limits:
          # The GPU does the work now, but frame decoding and tracking are still CPU-side.
          cpus: '12.0'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  celery_maintenance:
    # Same image so it does not need a second build; it does no inference, so no GPU.
    image: elderly-surveillance-app:gpu
  celery_beat:
    image: elderly-surveillance-app:gpu
  flower:
    image: elderly-surveillance-app:gpu
