services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: .
    # backend, celery_worker, celery_beat and flower all run the exact same
    # Dockerfile/build context with only their command differing -- naming the
    # image explicitly here and having the other three reference it via `image:`
    # (no `build:` of their own) means `docker compose build` builds it once
    # instead of four times, and Docker Desktop's image list shows one entry
    # instead of four identically-sized ones.
    image: elderly-surveillance-app:latest
    command: flask run --host=0.0.0.0 --port=${PORT:-8932}
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
      - TF_CPP_MIN_LOG_LEVEL=3
      - CUDA_VISIBLE_DEVICES=""
      - OMP_NUM_THREADS=1
      - TF_ENABLE_ONEDNN_OPTS=0
      # Fall model = PRODUCTION (stock pose + v3 classifier @0.65) for the 9 Oct test (owner, 8 Oct). Option A
      # (Le2i half 1: 42.5 vs 42.0 falls /47, 0/16 false alarms both) sees furniture as people in empty rooms -- COCO
      # empty home scenes 14.0 % vs 8.1 % of images, and an empty-room soak camera raised 24 false 'alone' alerts in 4 h
      # -- so it stays a switch. To use A, put these three lines in .env and `docker compose up -d --force-recreate`:
      #   V3_POSE_MODEL=pose_nightaug_s44.pt  V3_CLASSIFIER=fall_classifier_t2full_s45.onnx  V3_THRESHOLD=0.70
      # Same values in backend and celery_worker (both load the detector); the worker's "model identity" line shows which.
      - V3_POSE_MODEL=${V3_POSE_MODEL:-yolo26s-pose.pt}
      - V3_CLASSIFIER=${V3_CLASSIFIER:-fall_classifier_v3.onnx}
      - V3_THRESHOLD=${V3_THRESHOLD:-0.65}
    deploy:
      resources:
        limits:
          cpus: '1.0'
    ports:
      - "8932:8932"
    depends_on:
      - db
      - redis
  celery_worker:
    image: elderly-surveillance-app:latest
    # -Q celery: this worker takes camera tasks only. Its slots are all held by infinite
    # detection loops, so maintenance tasks get their own worker below rather than queueing
    # behind cameras that never finish.
    command: sh -c "celery -A app.celery worker -Q celery --concurrency=${CAMERA_MAX_PARALLEL:-4} --loglevel=info"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
      - TF_CPP_MIN_LOG_LEVEL=3
      - CUDA_VISIBLE_DEVICES=""
      - TF_ENABLE_ONEDNN_OPTS=0
      # Fall model = PRODUCTION (stock pose + v3 classifier @0.65) for the 9 Oct test (owner, 8 Oct). Option A
      # (Le2i half 1: 42.5 vs 42.0 falls /47, 0/16 false alarms both) sees furniture as people in empty rooms -- COCO
      # empty home scenes 14.0 % vs 8.1 % of images, and an empty-room soak camera raised 24 false 'alone' alerts in 4 h
      # -- so it stays a switch. To use A, put these three lines in .env and `docker compose up -d --force-recreate`:
      #   V3_POSE_MODEL=pose_nightaug_s44.pt  V3_CLASSIFIER=fall_classifier_t2full_s45.onnx  V3_THRESHOLD=0.70
      # Same values in backend and celery_worker (both load the detector); the worker's "model identity" line shows which.
      - V3_POSE_MODEL=${V3_POSE_MODEL:-yolo26s-pose.pt}
      - V3_CLASSIFIER=${V3_CLASSIFIER:-fall_classifier_v3.onnx}
      - V3_THRESHOLD=${V3_THRESHOLD:-0.65}
      # Only this worker restarts camera loops when it comes up; the maintenance worker shares
      # the same code and must not. Detection tasks are infinite loops that never survive a
      # worker restart, so without this a restart leaves every camera marked active in the
      # database, shown as "monitoring" in the UI, and watched by nothing.
      - RESUME_ACTIVE_CAMERAS=1
      # This file is the CPU deployment -- docker-compose.gpu.yml overlays the GPU settings on
      # top of it -- and the target server is four cores with no GPU. Tuned there, measured in
      # a container limited the same way (SS62):
      #
      #   imgsz 960, one OMP thread   1.5 fps live,  5/60 URFD falls,  48/79 GMDCSA falls
      #   imgsz 320, threads pinned   8.1 fps live, 34/60 URFD falls,  67/79 GMDCSA falls
      #
      # Input size is the lever on CPU (unlike the GPU, where it changed nothing because the
      # bottleneck was CPU-side resizing): the model's own cost scales with it, and the frame
      # rate it buys is worth far more than the pose detail it costs. 320 beat 960, 640, 480,
      # 384, 256 and 192 once each was paired with the rate it can actually reach, and it beat
      # yolo26n-pose at matched cost on falls (34/60 against 26/60) -- the smaller model trades
      # recall for quiet, which is the wrong trade here.
      - V3_IMGSZ=320
      # Pinned so the rate is a setting rather than whatever the machine manages. 8 is what
      # this machine's four-core container sustains WITH alone-detection running; the
      # production server is a QEMU VM with slower cores and will sit below it, so measure
      # there before trusting the recall figures above.
      - V3_TARGET_FPS=${V3_TARGET_FPS:-8}
      # RTSP over TCP: UDP media does not cross NAT/VPN (measured: UDP 0 frames, TCP 1.8 s).
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
      # Pose on a crop around the people at 256 px, full-frame pass every 8 frames. Owner's
      # compilation footage at this profile: 34/75 real falls caught against 28/75 full-frame,
      # false alarms 1 against 2; URFD 46/60 against 45/60; ~11% cheaper per frame on four
      # threads. Risk: a person entering the picture is looked for on the full pass only
      # (about once a second). Owner approved as the default, 2026-09-30. Set in `environment:`
      # rather than .env on purpose: Compose environment wins over env_file (Codex, R3).
      - V3_ROI_IMGSZ=256
      - V3_ROI_FULL_EVERY=8
      # OMP_NUM_THREADS is deliberately NOT set: app/services/cpu_tuning reads the container's
      # real CPU quota and pins torch and onnxruntime to it, after the pose model loads.
      # Pinning it to 1 here (as this file used to) halved the frame rate on a CPU-only host.
    deploy:
      resources:
        limits:
          # Most of the machine. The backend and the maintenance worker are idle almost all the
          # time, and `cpus` is a ceiling rather than a reservation, so this does not take
          # anything from them -- it stops one camera from using the whole box and leaving the
          # web UI unresponsive. Measured: 4.0 gives 8.9 fps, 3.5 gives 8.1, 2.0 is half that.
          cpus: '3.5'
        reservations:
          cpus: '0.5'
    depends_on:
      - backend
      - redis
  celery_maintenance:
    # Serves the queue beat schedules onto (escalation re-alerts). Separate from
    # celery_worker because that one's slots are permanently occupied by camera loops --
    # measured: 11 escalation sweeps sent, 1 executed, before this existed.
    image: elderly-surveillance-app:latest
    command: sh -c "celery -A app.celery worker -Q maintenance --concurrency=1 --loglevel=info"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
      - CUDA_VISIBLE_DEVICES=""
    deploy:
      resources:
        limits:
          cpus: '1.0'
    depends_on:
      - backend
      - redis

  celery_beat:
    image: elderly-surveillance-app:latest
    command: sh -c "celery -A app.celery beat --loglevel=info"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
    depends_on:
      - backend
      - redis
  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
  flower:
    image: elderly-surveillance-app:latest
    command: sh -c "celery -A app.celery flower --port=5555"
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
    depends_on:
      - redis
volumes:
  pgdata: 